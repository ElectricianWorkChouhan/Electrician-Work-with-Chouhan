name: Build Electrician Work with Chouhan V2.2 APK

on:
workflow_dispatch:
push:
paths:
- 'Electrician-Work-with-Chouhan-V2.2-FULL-Project.zip'
- '.github/workflows/build.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract V2.2 Project Only
    id: find_project
    shell: bash
    run: |
      set -e

      ZIP_FILE="Electrician-Work-with-Chouhan-V2.2-FULL-Project.zip"

      if [ ! -f "$ZIP_FILE" ]; then
        echo "ERROR: V2.2 ZIP file not found in repository root!"
        exit 1
      fi

      mkdir -p v22_project

      unzip -q "$ZIP_FILE" -d v22_project

      PROJECT_DIR=$(find v22_project \
        -type f \
        -name "settings.gradle.kts" \
        -print -quit \
        | xargs -r dirname)

      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: Android project not found inside V2.2 ZIP!"
        exit 1
      fi

      echo "V2.2 Android project found:"
      echo "$PROJECT_DIR"

      echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

  - name: Build V2.2 Debug APK
    shell: bash
    run: |
      set -e

      PROJECT_DIR="${{ steps.find_project.outputs.project_dir }}"

      gradle \
        -p "$PROJECT_DIR" \
        --no-daemon \
        assembleDebug

  - name: Find APK
    id: apk
    shell: bash
    run: |
      set -e

      PROJECT_DIR="${{ steps.find_project.outputs.project_dir }}"

      APK_PATH=$(find "$PROJECT_DIR" \
        -type f \
        -path "*/build/outputs/apk/debug/*.apk" \
        -print -quit)

      if [ -z "$APK_PATH" ]; then
        echo "ERROR: APK file was not created!"
        exit 1
      fi

      echo "APK created:"
      echo "$APK_PATH"

      echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

  - name: Upload V2.2 APK
    uses: actions/upload-artifact@v4
    with:
      name: Electrician-Work-with-Chouhan-V2.2-debug-apk
      path: ${{ steps.apk.outputs.apk_path }}
      if-no-files-found: error
