name: Electrician Work with Chouhan V2.2.1 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Electrician-Work-with-Chouhan-Updated/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: Electrician-Work-with-Chouhan-Updated
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Electrician-Work-with-Chouhan-V2.2.1-debug-apk
          path: Electrician-Work-with-Chouhan-Updated/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
