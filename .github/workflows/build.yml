name: Build Electrician Work APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android Project
        run: |
          ZIP="./Chouhan_Android_Project_2026_FIXED_V2.zip"
          test -n "$ZIP"
          unzip -q "$ZIP"

      - name: Build APK
        working-directory: Electrician_Work_with_Chouhan_Android_Project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Electrician-Work-with-Chouhan-APK
          path: Electrician_Work_with_Chouhan_Android_Project/app/build/outputs/apk/debug/app-debug.apk
