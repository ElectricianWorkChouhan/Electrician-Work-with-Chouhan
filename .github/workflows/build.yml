name: Build Electrician Work V2.3.7 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Electrician-Work-with-Chouhan-V2.3.7-FULL-Project.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V2.3.7 Project ZIP
        run: |
          ZIP_FILE="Electrician-Work-with-Chouhan-V2.3.7-FULL-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V2.3.7 ZIP not found in repository root"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "V2.3.7 ZIP extracted successfully"

      - name: Find Android Project
        id: project
        run: |
          echo "Searching for Android project..."

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find extracted -maxdepth 5 -type f -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          echo "Building project: $PROJECT_DIR"

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"

            "$PROJECT_DIR/gradlew" \
              -p "$PROJECT_DIR" \
              --no-daemon \
              assembleDebug
          else
            gradle \
              -p "$PROJECT_DIR" \
              --no-daemon \
              assembleDebug
          fi

      - name: Find and Prepare APK
        run: |
          echo "Searching for APK files..."

          find extracted -type f -name "*.apk" -print

          APK_PATH=$(find extracted -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            echo "Checking build output folders..."

            find extracted -type d -name build -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK_PATH"

          mkdir -p apk-output

          cp "$APK_PATH" \
            apk-output/Electrician-Work-with-Chouhan-V2.3.7.apk

          echo "APK prepared successfully"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Electrician-Work-with-Chouhan-V2.3.7-APK
          path: apk-output/Electrician-Work-with-Chouhan-V2.3.7.apk
          if-no-files-found: error
