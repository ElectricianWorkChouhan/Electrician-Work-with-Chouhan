Build Electrician Work APK

on:
workflow_dispatch:
push:
paths:
- "*.zip"
- ".github/workflows/**"

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Setup Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: "17"

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Extract Android Project
    env:
      ZIP_FILE: Electrician-Work-with-Chouhan-V1.9-FIXED.zip
    run: |
      if [ ! -f "$ZIP_FILE" ]; then
        echo "ZIP file not found: $ZIP_FILE"
        ls -la
        exit 1
      fi
      mkdir -p extracted
      unzip -q "$ZIP_FILE" -d extracted

  - name: Build APK
    run: |
      SETTINGS_FILE=$(find extracted -name settings.gradle.kts -print -quit)
      if [ -z "$SETTINGS_FILE" ]; then
        echo "Android project settings.gradle.kts not found"
        exit 1
      fi
      PROJECT_DIR=$(dirname "$SETTINGS_FILE")
      gradle -p "$PROJECT_DIR" assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Electrician-Work-with-Chouhan-APK
      path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      
