name: Build Electrician Work V2.3.4 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Electrician-Work-with-Chouhan-V2.3.4-Add-Electrician-Full-Options.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V2.3.4 ZIP
        run: |
          ZIP_FILE="Electrician-Work-with-Chouhan-V2.3.4-Add-Electrician-Full-Options.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found in repository root"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Android Project
        id: project
        run: |
          PROJECT_DIR=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          gradle -p "${{ steps.project.outputs.project_dir }}" \
            --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          APK_PATH=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f -path "*/build/outputs/apk/*/debug/*.apk" \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK_PATH" \
            apk-output/Electrician-Work-with-Chouhan-V2.3.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Electrician-Work-with-Chouhan-V2.3.4-APK
          path: apk-output/Electrician-Work-with-Chouhan-V2.3.4.apk
