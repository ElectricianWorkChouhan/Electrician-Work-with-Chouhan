name: Electrician Work with Chouhan V2.2 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository डाउनलोड करें
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17 सेट करें
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 8.9 सेट करें
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 4. Android Project खोजें या ZIP Extract करें
      - name: Find Android Project
        id: find_project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Android project..."

          PROJECT_DIR=""

          # पहले Repository में Gradle project खोजें
          while IFS= read -r file; do
            dir=$(dirname "$file")

            if [ -f "$dir/app/build.gradle" ] || \
               [ -f "$dir/app/build.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(
            find . -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*"
          )

          # यदि project नहीं मिला, तो ZIP फाइल Extract करें
          if [ -z "$PROJECT_DIR" ]; then
            echo "Project not found directly. Searching ZIP files..."

            mkdir -p extracted_projects

            ZIP_FOUND="false"

            while IFS= read -r zipfile; do
              echo "Extracting: $zipfile"

              zipname=$(basename "$zipfile" .zip)
              destination="extracted_projects/$zipname"

              mkdir -p "$destination"
              unzip -o "$zipfile" -d "$destination"

              ZIP_FOUND="true"
            done < <(
              find . -maxdepth 2 -type f -name "*.zip" \
                -not -path "./extracted_projects/*"
            )

            if [ "$ZIP_FOUND" = "false" ]; then
              echo "ERROR: No Android project or ZIP found."
              exit 1
            fi

            # Extract किए गए project में Gradle file खोजें
            while IFS= read -r file; do
              dir=$(dirname "$file")

              if [ -f "$dir/app/build.gradle" ] || \
                 [ -f "$dir/app/build.gradle.kts" ]; then
                PROJECT_DIR="$dir"
                break
              fi
            done < <(
              find extracted_projects -type f \
                \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                -not -path "*/.gradle/*" \
                -not -path "*/build/*"
            )
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            echo "Check that the ZIP contains settings.gradle and app/build.gradle."
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 5. Android APK Build करें
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="${{ steps.find_project.outputs.project_dir }}"

          echo "Building project from: $PROJECT_DIR"

          gradle \
            -p "$PROJECT_DIR" \
            --no-daemon \
            assembleDebug

      # 6. APK Artifact Upload करें
      - name: Upload V2.2 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Electrician-Work-with-Chouhan-V2.2-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
