name: Build Electrician Work V2.3.7 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Electrician-Work-with-Chouhan-V2.3.7-Customer-Dashboard-FULL-Project.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V2.3.7 Customer Dashboard Project ZIP
        run: |
          ZIP_FILE="Electrician-Work-with-Chouhan-V2.3.7-Customer-Dashboard-FULL-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: V2.3.7 Customer Dashboard ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "V2.3.7 ZIP extracted successfully"

      - name: Find Android Project
        id: project
        run: |
          echo "Searching for Android project..."

