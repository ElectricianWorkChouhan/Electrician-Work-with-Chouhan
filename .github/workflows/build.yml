name: Electrician Work Chouhan V2.0 APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE="Electrician-Work-with-Chouhan-V2.0-FIXED.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP not found"
            ls -la
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d project

      - name: Find Gradle Wrapper
        run: |
          find project -name gradlew -type f

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          WRAPPER=$(find project -name gradlew -type f | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "gradlew not found inside ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Electrician-Work-with-Chouhan-V2.0-debug-apk
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
