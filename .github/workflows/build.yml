name: Electrician Work with Chouhan V2.2.1 APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths:
      - 'Electrician-Work-with-Chouhan-Updated/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Project Folder
        run: |
          echo "Checking Android project..."
          ls -la
          ls -la Electrician-Work-with-Chouhan-Updated/Electrician-Work-with-Chouhan-Updated

      - name: Build Debug APK
        working-directory: Electrician-Work-with-Chouhan-Updated/Electrician-Work-with-Chouhan-Updated
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Electrician-Work-with-Chouhan-V2.2.1-debug-apk
          path: Electrician-Work-with-Chouhan-Updated/Electrician-Work-with-Chouhan-Updated/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
