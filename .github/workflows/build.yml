name: Build Electrician Work APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check ZIP File
        run: |
          ZIP_FILE='Electrician-Work-with-Chouhan-V1.9-FIXED.zip'
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found: $ZIP_FILE"
            ls -la
            exit 1
          fi

      - name: Extract Android Project
        run: |
          mkdir -p extracted
          unzip -q 'Electrician-Work-with-Chouhan-V1.9-FIXED.zip' -d extracted

      - name: Find Android Project
        run: |
          SETTINGS_FILE=$(find extracted -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo 'Android project settings.gradle.kts not found'
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Electrician-Work-with-Chouhan-APK
          path: 'extracted/**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error
          
