name: Electrician Work with Chouhan V2.2.1 APK

on:
workflow_dispatch:

push:
branches:
- main
- master
paths:
- '*.zip'
- '.github/workflows/build.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract Android Project
    run: |
      ZIP_FILE="Electrician-Work-with-Chouhan-V2.2.1-Dashboard-Fixed.zip"

      if [ ! -f "$ZIP_FILE" ]; then
        echo "Project ZIP not found!"
        ls -la
        exit 1
      fi

      mkdir -p extracted
      unzip -q "$ZIP_FILE" -d extracted

      PROJECT_FILE=$(find extracted -type f -name "settings.gradle.kts" -o -name "settings.gradle" -print -quit)

      if [ -z "$PROJECT_FILE" ]; then
        echo "Android project not found!"
        exit 1
      fi

      PROJECT_DIR=$(dirname "$PROJECT_FILE")

      echo "Project found: $PROJECT_DIR"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Build Debug APK
    run: |
      cd "$PROJECT_DIR"
      gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Electrician-Work-with-Chouhan-V2.2.1-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
