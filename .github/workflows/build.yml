name: Electrician Work with Chouhan V2.2 APK

"on":
  workflow_dispatch:
  push:
    paths:
      - 'Electrician-Work-with-Chouhan-V2.2-FULL-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V2.2 project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Electrician-Work-with-Chouhan-V2.2-FULL-Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE is not in the repository root."
            exit 1
          fi

          mkdir -p extracted_v22
          unzip -q "$ZIP_FILE" -d extracted_v22

          PROJECT_DIR="extracted_v22/Electrician-Work-with-Chouhan-Updated"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Expected V2.2 Android project files were not found in the ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build V2.2 debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload V2.2 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Electrician-Work-with-Chouhan-V2.2-debug-apk
          path: extracted_v22/Electrician-Work-with-Chouhan-Updated/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
