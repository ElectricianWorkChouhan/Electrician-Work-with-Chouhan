name: Build Electrician Work V2.3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Electrician-Work-with-Chouhan-V2.3.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract V2.3 ZIP
        run: |
          unzip -q Electrician-Work-with-Chouhan-V2.3.zip -d extracted

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(find extracted -name settings.gradle.kts -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Android Project: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Electrician-Work-with-Chouhan-V2.3-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
